    <!--Contact Page-->

  <body>
    <header>
      <div class="header">
        <div class="logo">

        <nav>

    <main>
      <div class="content">
        <div class="title">
          <h2>Mailbox</h2>
        </div>
        <div class="img">
          <img src="Images/Mailbox.jpeg" alt="an image of a pink postbox" />
        </div>
        <div class="text">
          <p>Add your info here to get in contact!</p>
        </div>
          <form action="./response.html">
            <div class="field1">
              <label for="Name"> Name:</label>
              <input type="text" name="Name" placeholder="What is your name?" />
             </div>
              <div class="field2">
                <label for="Email"> Email:</label>
                <input type="email" name="Email" placeholder="What is your email?" />
              </div>
              <div class="field3">
              <label for="Message"> Message:</label>
                  <input type="text" name="Message" placeholder="What do you want to say?"/>
              </div>
            <input type="submit" value="Submit Form" />
          </form>
        </div>
      </div>
    </main>
